[project]
name = "oura-ring-mcp"
version = "0.1.0"
description = "A MCP server for the Oura Ring API"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Nathan Thomas" }]
keywords = ["git", "mcp", "llm", "automation", "oura", "ring"]
license = { text = "MIT" }
dependencies = [
    "httpx==0.28.1",
    "mcp[cli]==1.17.0",
    "pydantic==2.12.0",
    "anyio==4.11.0",
    "requests==2.33.0",
]

[project.urls]
Repository = "https://github.com/nwthomas/oura-ring-mcp-server"
Issues = "https://github.com/nwthomas/oura-ring-mcp-server/issues"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "pytest-mock==3.15.1",
]

[tool.pylint."messages control"]
disable = [
    "C0103",
    "C0114",
    "C0115",
    "C0116",
    "C0301",
    "C0303",
    "C0321",
    "C0413",
    "C2801",
    "R0903",
    "W0104",
    "W0106",
    "W0107",
    "W0212",
    "W0621",
    "W0702",
]
